<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Works · Mattie Chernos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#EDF3EE;         /* the site wall, desaturated — back of house, same building */
  --panel:#FFFFFF;
  --ink:#28251F;
  --soft:rgba(40,37,31,.55);
  --line:rgba(40,37,31,.16);
  --hair:rgba(40,37,31,.09);
  --accent:#9BB09F;       /* the frame colour */
  --warn:#8A3324;
  --serif:'EB Garamond',Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font:400 14px/1.5 var(--sans)}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}

/* ---------- chrome ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 22px;background:var(--wall);border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.bar .spacer{flex:1}
.status{font-size:12.5px;color:var(--soft)}
.status.dirty{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 13px;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.btn.primary[disabled]{background:var(--soft);border-color:transparent;color:var(--wall)}
.btn.quiet{border-color:transparent;background:none;color:var(--soft);padding:7px 6px}
.btn.quiet:hover{color:var(--ink)}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}

.notice{padding:11px 22px;font-size:13px;background:#F6EFD9;border-bottom:1px solid var(--line)}
.notice.bad{background:#F6E2DC}
.notice b{font-weight:600}

.wrap{max-width:1080px;margin:0 auto;padding:22px}

/* ---------- rows ---------- */
.row{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:14px;margin-bottom:10px;align-items:flex-start}
.row.drag{opacity:.4}
.row.over{border-color:var(--ink)}
.handle{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--soft);cursor:grab;user-select:none;padding-top:2px}
.handle .grip{font-size:15px;line-height:1}
.handle .n{font-size:11px;font-variant-numeric:tabular-nums}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows button{border:0;background:none;color:var(--soft);font-size:11px;line-height:1;padding:2px 4px}
.arrows button:hover{color:var(--ink)}

.thumb{flex:0 0 96px;width:96px;height:96px;border:1px solid var(--hair);background:var(--wall);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .empty{font-size:11px;color:var(--soft);text-align:center;padding:6px}

.fields{flex:1;min-width:0;display:grid;grid-template-columns:2fr 5rem 1.4fr 1.4fr;gap:9px}
.fields .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.f input,.f select{border:1px solid var(--line);border-radius:2px;padding:6px 7px;background:var(--panel);width:100%;min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.f input[disabled]{background:var(--wall);color:var(--soft)}
.f.money input{font-variant-numeric:tabular-nums}

.saletag{grid-column:1/-1;font-size:11px;letter-spacing:.03em;padding-top:1px}
.saletag.live{color:#3f6b3f}
.saletag.warn{color:#8a6d1f}
.saletag.off{color:var(--soft)}

.rowside{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.busy{font-size:11.5px;color:var(--soft)}
.adv{grid-column:1/-1;display:flex;gap:9px;align-items:flex-end;border-top:1px dashed var(--hair);padding-top:9px}
.adv .f{flex:1}
.path{font-size:11px;color:var(--soft);word-break:break-all;text-align:right;max-width:190px}

/* ---------- sign in ---------- */
.signin{max-width:320px;margin:16vh auto;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:26px}
.signin h1{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.13em;
  text-transform:uppercase;margin:0 0 18px}
.signin input{width:100%;border:1px solid var(--line);border-radius:2px;padding:9px;margin-bottom:12px}
.signin .err{color:var(--warn);font-size:12.5px;margin-bottom:10px}
.loading{padding:18vh 0;text-align:center;color:var(--soft)}

@media (max-width:760px){
  .fields{grid-template-columns:1fr 1fr}
  .row{flex-wrap:wrap}
  .rowside{flex-direction:row;width:100%;justify-content:flex-end;align-items:center}
  .path{text-align:left;max-width:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
/* admin · build 2026-08-07-a
 *
 * Two modes, chosen at load:
 *   api    — api.php answered. Sign in, save straight to works.json, upload images.
 *   static — no PHP (GitHub Pages, file://). Edits are local; Save downloads works.json
 *            and images download beside it, for you to commit by hand.
 */
const {useState, useEffect, useRef, useCallback} = React;

const API = 'api.php';
const MAX_EDGE = 1600;
const QUALITY  = 0.82;

/* ---------------------------------------------------------------- helpers */
async function api(action, opts) {
  opts = opts || {};
  const headers = {'X-Admin': '1'};
  if (opts.json) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + '?action=' + action, {
    method: opts.method || 'GET',
    credentials: 'same-origin',
    headers: headers,
    body: opts.json ? JSON.stringify(opts.json) : opts.body
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { const err = new Error('api.php did not return JSON (HTTP ' + res.status + ')'); err.status = res.status; throw err; }
  if (!res.ok) { const err = new Error(data.error || ('HTTP ' + res.status)); err.status = res.status; err.data = data; throw err; }
  return data;
}

let uid = 0;
const withUid = w => Object.assign({
  title: '', year: '', medium: '', dims: '', src: '', master: '', aspect: [4, 5],
  price: null, status: 'available', stripe_link: '', drop: null
}, w, {_uid: ++uid});

const strip = works => works.map(w => {
  const o = Object.assign({}, w);
  delete o._uid;
  return o;
});

const centsToStr = c => (c === null || c === undefined || c === '') ? '' : (c / 100).toFixed(2);
function strToCents(s) {
  const n = parseFloat(String(s).replace(/[^0-9.]/g, ''));
  return isFinite(n) ? Math.round(n * 100) : null;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* Resize to a 1600px long edge JPEG. createImageBitmap with imageOrientation
   honours EXIF rotation — an <img> tag would hand back sideways phone shots. */
async function resizeToJpeg(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) { bmp = await createImageBitmap(file); }
  const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return new Promise(res => c.toBlob(res, 'image/jpeg', QUALITY));
}

const slugify = name => (name.replace(/\.[^.]+$/, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'work');

/* what a visitor actually sees on the public site for this row right now —
   keeps "is the Buy button live" answerable at a glance while editing. */
function saleState(w) {
  if (w.status === 'sold') return {cls: 'off', text: 'Shown as Sold on the site.'};
  if (w.status === 'nfs') return {cls: 'off', text: 'Displayed, no price or Buy button (not for sale).'};
  if (w.price === null || w.price === undefined) return {cls: 'warn', text: 'Available, but no price set — nothing shows yet.'};
  if (!w.stripe_link) return {cls: 'warn', text: 'Price shows ($' + centsToStr(w.price) + '), no Buy button until a Stripe link is added.'};
  return {cls: 'live', text: 'Buy button is live at $' + centsToStr(w.price) + '.'};
}

/* ---------------------------------------------------------------- one row */
function WorkRow(props) {
  const w = props.work;
  const [priceText, setPriceText] = useState(centsToStr(w.price));
  const [advanced, setAdvanced] = useState(false);
  const [busy, setBusy] = useState('');
  const [preview, setPreview] = useState('');

  const set = (patch) => props.onChange(props.index, patch);
  const sellable = w.status === 'available';

  async function chooseFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      setBusy('Resizing');
      const web = await resizeToJpeg(file);
      const stem = slugify(file.name);
      if (props.mode === 'api') {
        setBusy('Uploading');
        const fd = new FormData();
        fd.append('web', web, stem + '.jpg');
        fd.append('master', file);
        fd.append('name', file.name);
        const d = await api('upload', {method: 'POST', body: fd});
        set({src: d.src, master: d.master});
        setPreview('');
      } else {
        download(web, stem + '.jpg');
        set({src: 'images/' + stem + '.jpg', master: ''});
        setPreview(URL.createObjectURL(web));
      }
      setBusy('');
    } catch (err) {
      setBusy('');
      props.onError(err.message);
    }
  }

  return (
    <div
      className={'row' + (props.dragging ? ' drag' : '') + (props.over ? ' over' : '')}
      draggable
      onDragStart={() => props.onDragStart(props.index)}
      onDragOver={(e) => { e.preventDefault(); props.onDragOver(props.index); }}
      onDrop={(e) => { e.preventDefault(); props.onDrop(); }}
      onDragEnd={props.onDrop}
    >
      <div className="handle" title="Drag to reorder">
        <span className="grip">⠿</span>
        <span className="n">{props.index + 1}</span>
        <span className="arrows">
          <button type="button" onClick={() => props.onMove(props.index, -1)} aria-label="Move up">▲</button>
          <button type="button" onClick={() => props.onMove(props.index, 1)} aria-label="Move down">▼</button>
        </span>
      </div>

      <div className="thumb">
        {(preview || w.src)
          ? <img src={preview || w.src} alt="" onError={(e) => { e.target.style.display = 'none'; }} />
          : <span className="empty">No image</span>}
      </div>

      <div className="fields">
        <div className="f">
          <label>Title</label>
          <input value={w.title} onChange={e => set({title: e.target.value})} />
        </div>
        <div className="f">
          <label>Year</label>
          <input value={w.year} onChange={e => set({year: e.target.value.replace(/[^0-9]/g, '')})} />
        </div>
        <div className="f">
          <label>Medium</label>
          <input value={w.medium} onChange={e => set({medium: e.target.value})} />
        </div>
        <div className="f">
          <label>Dimensions</label>
          <input value={w.dims} onChange={e => set({dims: e.target.value})} />
        </div>

        <div className="f">
          <label>Status</label>
          <select value={w.status} onChange={e => set({status: e.target.value})}>
            <option value="available">Available</option>
            <option value="sold">Sold</option>
            <option value="nfs">Not for sale</option>
          </select>
        </div>
        <div className="f money">
          <label>Price</label>
          <input
            value={sellable ? priceText : ''}
            disabled={!sellable}
            placeholder={sellable ? '0.00' : '—'}
            onChange={e => { setPriceText(e.target.value); set({price: strToCents(e.target.value)}); }}
            onBlur={() => setPriceText(centsToStr(w.price))}
          />
        </div>
        <div className="f" style={{gridColumn: 'span 2'}}>
          <label>Stripe payment link</label>
          <input
            value={w.stripe_link}
            disabled={!sellable}
            placeholder={sellable ? 'https://buy.stripe.com/…' : '—'}
            onChange={e => set({stripe_link: e.target.value})}
          />
        </div>

        <div className={'saletag ' + saleState(w).cls}>{saleState(w).text}</div>

        {advanced &&
          <div className="adv">
            <div className="f">
              <label>Image path</label>
              <input value={w.src} onChange={e => set({src: e.target.value})} />
            </div>
            <div className="f">
              <label>Vertical nudge</label>
              <input value={w.drop || ''} placeholder="110px" onChange={e => set({drop: e.target.value || null})} />
            </div>
            <div className="f">
              <label>Master file</label>
              <input value={w.master} readOnly />
            </div>
          </div>}
      </div>

      <div className="rowside">
        <span className="btn filebtn">
          {w.src ? 'Replace photo' : 'Add photo'}
          <input type="file" accept="image/*" onChange={chooseFile} />
        </span>
        {busy && <span className="busy">{busy}…</span>}
        {w.src && !advanced && <span className="path">{w.src}</span>}
        <button type="button" className="btn quiet" onClick={() => setAdvanced(!advanced)}>
          {advanced ? 'Hide details' : 'Details'}
        </button>
        <button type="button" className="btn quiet danger" onClick={() => props.onDelete(props.index)}>Delete</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- sign in */
function SignIn(props) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit() {
    setBusy(true); setErr('');
    try { await api('login', {method: 'POST', json: {password: pw}}); props.onDone(); }
    catch (e) { setErr(e.message); setBusy(false); }
  }

  return (
    <div className="signin">
      <h1>Mattie Chernos</h1>
      <input
        type="password" value={pw} autoFocus placeholder="Password"
        onChange={e => setPw(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') submit(); }}
      />
      {err && <div className="err">{err}</div>}
      <button className="btn primary" style={{width: '100%'}} disabled={busy || !pw} onClick={submit}>
        {busy ? 'Signing in…' : 'Sign in'}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------------- the app */
function Admin(props) {
  const [works, setWorks] = useState([]);
  const [rev, setRev] = useState('');
  const [saved, setSaved] = useState('[]');
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const drag = useRef({from: null, over: null});
  const [, force] = useState(0);

  const dirty = loaded && JSON.stringify(strip(works)) !== saved;

  // ---- load
  useEffect(() => {
    (async () => {
      try {
        if (props.mode === 'api') {
          const d = await api('works');
          const rows = (d.works || []).map(withUid);
          setWorks(rows); setRev(d.rev); setSaved(JSON.stringify(strip(rows)));
        } else {
          const res = await fetch('works.json', {cache: 'no-store'});
          const d = res.ok ? await res.json() : [];
          const rows = (Array.isArray(d) ? d : d.works || []).map(withUid);
          setWorks(rows); setSaved(JSON.stringify(strip(rows)));
        }
      } catch (e) {
        setMsg({bad: true, text: 'Could not load works.json — starting from an empty list. ' + e.message});
      }
      setLoaded(true);
    })();
  }, [props.mode]);

  // ---- unsaved-changes guard
  useEffect(() => {
    const h = e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    addEventListener('beforeunload', h);
    return () => removeEventListener('beforeunload', h);
  }, [dirty]);

  // ---- editing
  const change = useCallback((i, patch) => {
    setWorks(prev => prev.map((w, k) => k === i ? Object.assign({}, w, patch) : w));
  }, []);

  const move = useCallback((i, dir) => {
    setWorks(prev => {
      const j = i + dir;
      if (j < 0 || j >= prev.length) return prev;
      const next = prev.slice();
      next.splice(j, 0, next.splice(i, 1)[0]);
      return next;
    });
  }, []);

  function onDragStart(i) { drag.current.from = i; force(n => n + 1); }
  function onDragOver(i) {
    const d = drag.current;
    if (d.from === null || d.from === i) return;
    setWorks(prev => { const n = prev.slice(); n.splice(i, 0, n.splice(d.from, 1)[0]); return n; });
    d.from = i;
    d.over = i;
    force(n => n + 1);
  }
  function onDrop() { drag.current = {from: null, over: null}; force(n => n + 1); }

  function addWork() {
    setWorks(prev => [withUid({title: 'Untitled'})].concat(prev));
    setMsg(null);
  }

  function del(i) {
    const w = works[i];
    if (!confirm('Delete “' + (w.title || 'this work') + '” from the site? The image file stays on the server.')) return;
    setWorks(prev => prev.filter((_, k) => k !== i));
  }

  // ---- saving
  async function save() {
    setBusy(true); setMsg(null);
    const payload = strip(works);
    try {
      const d = await api('save', {method: 'POST', json: {rev: rev, works: payload}});
      setRev(d.rev);
      setSaved(JSON.stringify(payload));
      setMsg({text: 'Saved ' + d.count + ' works at ' + new Date().toLocaleTimeString()});
    } catch (e) {
      if (e.status === 409) setMsg({bad: true, text: e.message});
      else if (e.status === 401) { setMsg({bad: true, text: 'Signed out. Reload and sign in again.'}); }
      else setMsg({bad: true, text: 'Not saved — ' + e.message});
    }
    setBusy(false);
  }

  function downloadJson() {
    const payload = strip(works);
    const text = JSON.stringify(payload, null, 2);
    download(new Blob([text], {type: 'application/json'}), 'works.json');
    setSaved(JSON.stringify(payload));
    setMsg({text: 'works.json downloaded. Commit it (and any new images) to see it live.'});
  }

  async function signOut() {
    if (dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
    try { await api('logout', {method: 'POST', json: {}}); } catch (e) {}
    location.reload();
  }

  if (!loaded) return <div className="loading">Loading works…</div>;

  return (
    <div>
      <div className="bar">
        <span className="wordmark">Works</span>
        <button className="btn" onClick={addWork}>Add work</button>
        <span className="spacer"></span>
        <span className={'status' + (dirty ? ' dirty' : '')}>
          {dirty ? 'Unsaved changes' : (works.length + ' works')}
        </span>
        {props.mode === 'api'
          ? <button className="btn primary" disabled={!dirty || busy} onClick={save}>
              {busy ? 'Saving…' : 'Save changes'}
            </button>
          : <button className="btn primary" onClick={downloadJson}>Download works.json</button>}
        <a className="btn quiet" href="index.html" target="_blank" rel="noopener">View site</a>
        {props.mode === 'api' && <button className="btn quiet" onClick={signOut}>Sign out</button>}
      </div>

      {props.mode === 'static' &&
        <div className="notice">
          <b>Local mode.</b> No api.php here, so nothing saves by itself. Edits stay in this tab —
          use Download works.json, and new photos download as resized JPEGs for the images folder.
        </div>}

      {msg && <div className={'notice' + (msg.bad ? ' bad' : '')}>{msg.text}</div>}

      <div className="wrap">
        {works.length === 0 &&
          <p style={{color: 'var(--soft)'}}>No works yet. Add work starts the first listing.</p>}
        {works.map((w, i) =>
          <WorkRow
            key={w._uid}
            work={w}
            index={i}
            mode={props.mode}
            dragging={drag.current.from === i}
            over={drag.current.over === i}
            onChange={change}
            onMove={move}
            onDelete={del}
            onError={t => setMsg({bad: true, text: t})}
            onDragStart={onDragStart}
            onDragOver={onDragOver}
            onDrop={onDrop}
          />)}
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState(null);   // null | 'login' | 'api' | 'static'

  useEffect(() => {
    api('me')
      .then(d => setMode(d.auth ? 'api' : 'login'))
      .catch(() => setMode('static'));
  }, []);

  if (mode === null) return <div className="loading">Checking for api.php…</div>;
  if (mode === 'login') return <SignIn onDone={() => setMode('api')} />;
  return <Admin mode={mode} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
